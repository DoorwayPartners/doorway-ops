<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' https://accounts.google.com/gsi/style; frame-src https://accounts.google.com/gsi/; connect-src 'self' https://accounts.google.com/gsi/ https://script.google.com https://script.googleusercontent.com; img-src 'self' data: https://*.googleusercontent.com; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#0f172a">
  <title>Doorway Ops</title>
  <link rel="stylesheet" href="styles.css?v=3.6">
</head>
<body>
  <div id="app" class="shell">
    <div class="sticky-stack">
      <header class="topbar">
        <div>
          <h1>Doorway Ops</h1>
          <p id="whoami" class="muted small">Command Center</p>
        </div>
        <button id="signout" class="btn ghost hidden" type="button">Sign out</button>
      </header>
      <div id="hud-host"></div>
      <div id="demo-banner" class="demo-banner hidden"></div>
    </div>
    <main id="main">
      <section id="signin" class="card center">
        <h2>Sign in</h2>
        <p class="muted">Use the Google account Doorway Partners added to the access list.</p>
        <div id="gsi-button"></div>
        <p id="signin-msg" class="muted small"></p>
      </section>
    </main>
    <footer class="foot muted small">V3.6 · Data from Doorway Partners sheets</footer>
  </div>
  <script src="config.js?v=3.6"></script>
  <script src="core.js?v=3.6"></script>
  <script src="app.js?v=3.6"></script>
</body>
</html>
